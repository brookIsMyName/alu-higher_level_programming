<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <rect width="900" height="330" rx="18" fill="#f4f7fb"/>
  <text x="40" y="48" font-family="sans-serif" font-size="25" font-weight="bold" fill="#172b4d">Names refer to objects</text>
  <text x="50" y="115" font-family="monospace" font-size="22" fill="#172b4d">items</text>
  <text x="50" y="165" font-family="monospace" font-size="22" fill="#172b4d">alias</text>
  <path d="M115 108 H270 M115 158 H270" stroke="#3973ac" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="285" y="78" width="230" height="112" rx="12" fill="#dceeff" stroke="#3973ac" stroke-width="2"/>
  <text x="320" y="120" font-family="sans-serif" font-size="19" fill="#172b4d">one list object</text>
  <text x="345" y="158" font-family="monospace" font-size="18" fill="#172b4d">[1, 2, 3]</text>
  <text x="50" y="250" font-family="monospace" font-size="22" fill="#172b4d">items</text>
  <path d="M115 243 H270" stroke="#d17b0f" stroke-width="3" marker-end="url(#arrow2)"/>
  <rect x="285" y="215" width="230" height="70" rx="12" fill="#fff0d8" stroke="#d17b0f" stroke-width="2"/>
  <text x="330" y="258" font-family="monospace" font-size="18" fill="#172b4d">[1, 2, 3, 4]</text>
  <text x="565" y="125" font-family="sans-serif" font-size="19" fill="#172b4d">Aliases share one list.</text>
  <text x="565" y="155" font-family="sans-serif" font-size="19" fill="#172b4d">Mutation is visible through both.</text>
  <text x="565" y="250" font-family="sans-serif" font-size="19" fill="#172b4d">Reassignment points one name</text>
  <text x="565" y="278" font-family="sans-serif" font-size="19" fill="#172b4d">to a different object.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3973ac"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d17b0f"/></marker>
  </defs>
</svg>
